schema_version: 1

context:
  name: QuantLib-python
  version: "1.44"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/lballabio/QuantLib-SWIG/releases/download/v${{ version }}/QuantLib-SWIG-${{ version }}.tar.gz
  sha256: 2c9bcae42b560bf6798c55d6c27bd79077a889eb6c07463f539d4a6b960d96e0
  patches:
    - no-isolation.diff

build:
  number: 0
  skip: win and vc<14

requirements:
  build:
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
    - ${{ compiler('cxx') }}
    - if: unix
      then:
        - autoconf
        - automake
        - make
    - swig
  host:
    - python
    - pip
    - libboost-devel
    - setuptools
    - python-build
    - quantlib ==${{ version }}
    - pytest
  run:
    - python
    - if: not win
      then: quantlib

tests:
  - files:
      source:
        - Python/test/*
    requirements:
      run:
        - pytest
    script:
      - pytest Python/test/

about:
  license: BSD-3-Clause
  license_file: LICENSE.TXT
  summary: The python wrapper of QuantLib.
  description: The QuantLib project (https://www.quantlib.org) is aimed at providing a comprehensive software framework for quantitative finance. QuantLib is a free/open-source library for modeling, trading, and risk management in real-life.
  homepage: https://github.com/lballabio/QuantLib
  repository: https://github.com/lballabio/QuantLib
  documentation: https://www.quantlib.org

extra:
  recipe-maintainers:
    - timkpaine
    - ruben-arts
